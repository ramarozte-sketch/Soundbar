name: Compilar APK - Soundbar Q990B

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4

      # Recria a chave a partir do segredo (fica só na máquina temporária do GitHub)
      - name: Chave de assinatura
        env:
          SB_KEYSTORE_B64: ${{ secrets.SB_KEYSTORE_B64 }}
        run: |
          echo "$SB_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/soundbar.jks"
          echo "SB_KEYSTORE_PATH=$RUNNER_TEMP/soundbar.jks" >> "$GITHUB_ENV"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # O Android SDK já vem instalado nas máquinas do GitHub; só aceitamos as licenças
      - name: Android SDK (licenças)
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | tail -n 1)
          yes | "$SDKM" --licenses > /dev/null || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK
        env:
          SB_STORE_PASS: ${{ secrets.SB_STORE_PASS }}
          SB_KEY_PASS: ${{ secrets.SB_KEY_PASS }}
          SB_KEY_ALIAS: ${{ secrets.SB_KEY_ALIAS }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Mudar nome do APK
        run: |
          mkdir -p saida
          cp app/build/outputs/apk/release/*.apk saida/Soundbar-Q990B.apk
          ls -la saida

      - name: Guardar APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Soundbar-Q990B-apk
          path: saida/Soundbar-Q990B.apk

      - name: Publicar na página de Releases (link direto para o telemóvel)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: soundbar-v${{ github.run_number }}
          name: Soundbar Q990B v${{ github.run_number }}
          files: saida/Soundbar-Q990B.apk
